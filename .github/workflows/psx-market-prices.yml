# Market Closing Prices scraper - runs psx.py daily after PSX market close
# Schedule: 12:00 UTC (5pm PKT) Monâ€“Fri only â€” PSX closed weekends
# Primary source: official mkt_summary download (dps.psx.com.pk/download/mkt_summary/YYYY-MM-DD.Z)
# Fallback: Playwright scrape of /historical (only when mkt_summary fails)
# Outputs: psx_full_dataset.csv, daily_prices.csv, price_changes.csv â†’ pushed to GitHub

name: PSX Market Closing Prices

on:
  # PSX_BLUE_CHIPS_SHUTDOWN: schedule disabled — product moved to psxbluechips.com
  workflow_dispatch:

jobs:
  scrape:
    if: false # PSX_BLUE_CHIPS_SHUTDOWN — use PSX Blue Chips
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: psx-market-prices-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (mkt_summary path â€” no Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run PSX closing board scraper
        env:
          CI: "true"
          PSX_SKIP_PAYOUTS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCRAPER_EMAIL_TO: ${{ secrets.SCRAPER_EMAIL_TO }}
        run: python psx.py

      - name: Commit and push price CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/psx_full_dataset.csv data/prices/daily_prices.csv data/prices/price_changes.csv
          if git diff --staged --quiet; then
            echo "No price CSV changes to commit"
            exit 0
          fi
          git commit -m "PSX price scraped: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
