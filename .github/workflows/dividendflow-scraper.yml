name: DividendFlow Scraper

on:
  # PSX_BLUE_CHIPS_SHUTDOWN: schedule disabled — product moved to psxbluechips.com
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    if: false # PSX_BLUE_CHIPS_SHUTDOWN — use PSX Blue Chips
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dividendflow-scraper-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Set up Python for PSX closing board
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (PSX mkt_summary)
        run: pip install pandas

      - name: PSX closing board (mkt_summary)
        env:
          PSX_SKIP_PAYOUTS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python psx.py

      - name: Run scraper pipeline
        uses: nick-fields/retry@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCRAPER_EMAIL_TO: ${{ secrets.SCRAPER_EMAIL_TO }}
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 45
          command: cd scripts && node run-all.js
